# Copy into an owned Android app repository and adapt the release build path.
# APSA requires CPython 3.11+ and installs its dependencies from PyPI.
name: APSA mobile audit
on:
  push:
  pull_request:
permissions:
  contents: read
  security-events: write
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install a reviewed APSA release
        run: python -m pip install 'apsa==1.5.1'
      - name: Build the owned release APK
        run: ./gradlew assembleRelease
      - name: Audit and preserve the policy decision
        id: audit
        env:
          APSA_HOME: ${{ runner.temp }}/apsa-home
        run: |
          # Commit a reviewed apsa.toml; do not generate a permissive policy here.
          # Public intelligence is a bounded recent window, not a historical catalog.
          # Exit 3 means a partial sync (for example a CVE backlog); coverage records it.
          apsa intel sync --json > intel-status.json || [ "$?" -eq 3 ] || exit 1
          set +e
          apsa scan app/build/outputs/apk/release/app-release.apk \
            --policy apsa.toml --format sarif --out apsa.sarif \
            --sarif-root app/build/outputs/apk/release/app-release.apk --json > audit-decision.json
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload the audit and decision
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apsa-audit
          path: |
            apsa.sarif
            apsa.sarif.decision.json
            audit-decision.json
            intel-status.json
      - name: Upload SARIF
        if: always() && hashFiles('apsa.sarif') != ''
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: apsa.sarif
      - name: Enforce the unified exit code
        if: always()
        env:
          AUDIT_RC: ${{ steps.audit.outputs.rc }}
        run: |
          case "$AUDIT_RC" in
            0) echo 'APSA policy passed' ;;
            3) echo '::error::Audit, intelligence, or required coverage is incomplete'; exit 1 ;;
            4) echo '::error::Findings exceeded the policy threshold'; exit 1 ;;
            1|2|130|'') echo '::error::APSA execution failed or was interrupted'; exit 1 ;;
            *) echo '::error::Unexpected APSA exit code'; exit 1 ;;
          esac
