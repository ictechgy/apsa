name: APSA mobile app security audit
description: Evidence-first Android/iOS audit of source, APK, AAB or IPA with SARIF upload to GitHub code scanning.
author: ictechgy
branding:
  icon: shield
  color: blue

inputs:
  path:
    description: Source folder or APK/AAB/IPA to audit, inside the workspace.
    default: "."
  version:
    description: APSA version installed from PyPI. Keep it equal to this action's release.
    default: "1.7.0"
  package:
    description: Advanced. A pip requirement or local path installed instead of apsa==version (for testing).
    default: ""
  policy:
    description: Project policy file (TOML/JSON). Its decision gates the job.
    default: ""
  baseline-file:
    description: Approved portable baseline for policy only_new.
    default: ""
  baseline-sha256:
    description: Independently pinned SHA-256 of baseline-file.
    default: ""
  fail-on:
    description: Without a policy, fail on non-candidate findings at or above this severity (low, medium, high, critical).
    default: ""
  fail-on-incomplete:
    description: Fail when the report records an incomplete audit (exit code 3, or a policy with fail_on_partial = false). Limited coverage counts only with strict-coverage or a policy with strict_coverage = true.
    default: "true"
  strict-coverage:
    description: Also treat limited coverage (every input examined, but the bounded static model abstained on some paths) as incomplete; passes --strict-coverage.
    default: "false"
  intel-sync:
    description: Fetch public Apple/Android/CVE/KEV advisories before scanning (network).
    default: "false"
  online:
    description: Send discovered dependency names and versions to OSV (see the APSA README).
    default: "false"
  upload-sarif:
    description: Upload the SARIF file to GitHub code scanning (needs security-events write).
    default: "true"
  category:
    description: Code scanning category for this analysis.
    default: "apsa"
  sarif-file:
    description: Where to write the SARIF file.
    default: "apsa.sarif"

outputs:
  sarif-file:
    description: Path of the written SARIF file.
    value: ${{ steps.scan.outputs.sarif-file }}
  report-id:
    description: APSA report ID.
    value: ${{ steps.scan.outputs.report-id }}
  exit-code:
    description: APSA exit code (0 complete for the stated scope, possibly with limited coverage; 3 incomplete; 4 policy or threshold failure, which takes precedence over 3).
    value: ${{ steps.scan.outputs.exit-code }}
  incomplete:
    description: "true when the report records an incomplete audit (an execution gap; with strict-coverage or policy strict_coverage, limited coverage too), otherwise false."
    value: ${{ steps.scan.outputs.incomplete }}

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        version: "0.12.1"
        enable-cache: false

    - name: Install APSA with the release's hash-locked dependencies
      shell: bash
      env:
        APSA_VERSION: ${{ inputs.version }}
        APSA_PACKAGE: ${{ inputs.package }}
      run: |
        if [ -n "$APSA_PACKAGE" ]; then
          spec="$APSA_PACKAGE"
        elif [[ "$APSA_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          spec="apsa==${APSA_VERSION}"
        else
          echo "::error::version must be an exact release such as 1.7.0" >&2
          exit 2
        fi
        own=$(sed -n 's/^version = "\(.*\)"$/\1/p' "$GITHUB_ACTION_PATH/pyproject.toml" | head -n 1)
        if [ -z "$APSA_PACKAGE" ] && [ "$APSA_VERSION" != "$own" ]; then
          echo "::warning::version $APSA_VERSION differs from this action's release ($own); its locked dependencies may not match. Pin the action commit of that release instead."
        fi
        venv="$RUNNER_TEMP/apsa-venv"
        # A job may run the action more than once; start from a fresh environment each time.
        uv venv --quiet --clear --python 3.12.13 "$venv"
        uv pip install --quiet --python "$venv/bin/python" --require-hashes -r "$GITHUB_ACTION_PATH/requirements-release.txt"
        uv pip install --quiet --python "$venv/bin/python" --no-deps "$spec"
        echo "$venv/bin" >> "$GITHUB_PATH"

    - name: Fetch public advisories
      if: inputs.intel-sync == 'true'
      shell: bash
      run: |
        set +e
        apsa --home "$RUNNER_TEMP/apsa-home" intel sync
        code=$?
        if [ "$code" = 3 ]; then
          echo "::warning::Advisory sync is partial (for example a CVE backlog); the audit's coverage records what was available."
        elif [ "$code" != 0 ]; then
          exit "$code"
        fi

    - name: Audit
      id: scan
      shell: bash
      env:
        APSA_TARGET: ${{ inputs.path }}
        APSA_POLICY: ${{ inputs.policy }}
        APSA_BASELINE_FILE: ${{ inputs.baseline-file }}
        APSA_BASELINE_SHA256: ${{ inputs.baseline-sha256 }}
        APSA_FAIL_ON: ${{ inputs.fail-on }}
        APSA_ONLINE: ${{ inputs.online }}
        APSA_STRICT_COVERAGE: ${{ inputs.strict-coverage }}
        APSA_SARIF: ${{ inputs.sarif-file }}
      run: |
        set +e
        python="$RUNNER_TEMP/apsa-venv/bin/python"
        helper="$GITHUB_ACTION_PATH/scripts/action_summary.py"
        if [ "$APSA_STRICT_COVERAGE" != "true" ] && [ "$APSA_STRICT_COVERAGE" != "false" ]; then
          echo "::error::strict-coverage must be true or false" >&2
          exit 2
        fi
        root=$("$python" -I "$helper" --sarif-root "$APSA_TARGET" "$GITHUB_WORKSPACE") || exit 2
        # Never upload results left by an earlier run.
        rm -f "$APSA_SARIF"
        args=(--json --home "$RUNNER_TEMP/apsa-home" scan "$APSA_TARGET" --format sarif --out "$APSA_SARIF" --sarif-root "$root")
        if [ -n "$APSA_POLICY" ]; then
          args+=(--policy "$APSA_POLICY" --decision-out "$RUNNER_TEMP/apsa.decision.json")
          if [ -n "$APSA_BASELINE_FILE" ]; then
            args+=(--baseline-file "$APSA_BASELINE_FILE" --baseline-sha256 "$APSA_BASELINE_SHA256")
          fi
        elif [ -n "$APSA_FAIL_ON" ]; then
          args+=(--fail-on "$APSA_FAIL_ON")
        fi
        if [ "$APSA_ONLINE" = "true" ]; then
          args+=(--online)
        fi
        if [ "$APSA_STRICT_COVERAGE" = "true" ]; then
          args+=(--strict-coverage)
        fi
        apsa "${args[@]}" > "$RUNNER_TEMP/apsa-result.json"
        code=$?
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        if [ -s "$APSA_SARIF" ]; then
          echo "sarif-file=$APSA_SARIF" >> "$GITHUB_OUTPUT"
        fi
        "$python" -I "$helper" --report-id "$RUNNER_TEMP/apsa-result.json" >> "$GITHUB_OUTPUT"
        "$python" -I "$helper" --threshold "$RUNNER_TEMP/apsa-result.json" "$APSA_FAIL_ON" >> "$GITHUB_OUTPUT"
        "$python" -I "$helper" --incomplete "$RUNNER_TEMP/apsa-result.json" "$APSA_STRICT_COVERAGE" >> "$GITHUB_OUTPUT"
        "$python" -I "$helper" --summary "$RUNNER_TEMP/apsa-result.json" "$code" "$APSA_STRICT_COVERAGE" >> "$GITHUB_STEP_SUMMARY"
        exit 0

    - name: Upload SARIF to code scanning
      # Fork pull requests and every Dependabot-triggered run get a read-only token that cannot upload.
      if: >-
        inputs.upload-sarif == 'true' && steps.scan.outputs.sarif-file != '' &&
        github.actor != 'dependabot[bot]' &&
        (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
      with:
        sarif_file: ${{ steps.scan.outputs.sarif-file }}
        category: ${{ inputs.category }}
        checkout_path: ${{ github.workspace }}

    - name: Apply the APSA result
      shell: bash
      env:
        CODE: ${{ steps.scan.outputs.exit-code }}
        THRESHOLD: ${{ steps.scan.outputs.threshold-exceeded }}
        REASONS: ${{ steps.scan.outputs.gate-reasons }}
        INCOMPLETE: ${{ steps.scan.outputs.incomplete }}
        FAIL_ON_INCOMPLETE: ${{ inputs.fail-on-incomplete }}
        SARIF: ${{ inputs.sarif-file }}
      run: |
        if [ ! -s "$SARIF" ]; then
          echo "::error::APSA did not write a SARIF file (exit code ${CODE:-unknown})." >&2
          exit 1
        fi
        # Exit 4 takes precedence over 3; the report is also read so a threshold is never masked.
        if [ "$CODE" = 4 ] || [ "$THRESHOLD" = true ]; then
          if [ -n "$REASONS" ]; then
            echo "::error::APSA policy gate failed: $REASONS (see the job summary)." >&2
          else
            echo "::error::APSA findings exceed the fail-on threshold." >&2
          fi
          exit 4
        fi
        case "$CODE" in
          0|3) ;;
          *) echo "::error::APSA failed with exit code ${CODE:-unknown}." >&2; exit 1 ;;
        esac
        # The report decides completeness: a lenient policy (fail_on_partial = false) exits 0 for a partial audit.
        if [ "$CODE" = 3 ] || [ "$INCOMPLETE" = true ]; then
          if [ "$FAIL_ON_INCOMPLETE" = "true" ]; then
            echo "::error::APSA reported a partial or incomplete audit. Review coverage before treating the result as complete." >&2
            exit 3
          fi
          echo "::warning::APSA reported a partial or incomplete audit."
        fi
