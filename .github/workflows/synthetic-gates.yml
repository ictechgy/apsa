name: Fresh synthetic release gates

on:
  push:
    branches: ["validation/apsa-final-*"]
  workflow_dispatch:
  pull_request:
    paths:
      - "src/mobile_audit/**"
      - "apsa/**"
      - "quaygate/**"
      - ".agents/skills/**"
      - "pyproject.toml"
      - "uv.lock"
      - "requirements-release.txt"
      - "action.yml"
      - "server.json"
      - ".claude-plugin/**"
      - "plugins/apsa/**"
      - "scripts/release.py"
      - "scripts/served_mcp_manifest.py"
      - "tests/**"
      - ".github/workflows/synthetic-gates.yml"

permissions:
  contents: read

jobs:
  source-package-mcp:
    name: Fresh package and MCP / ${{ matrix.os }} / ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        python: ["3.11.15", "3.12.13"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: "0.12.1"
          python-version: ${{ matrix.python }}
          enable-cache: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: "platforms;android-36 build-tools;36.0.0"
          log-accepted-android-sdk-licenses: false
      - name: Install exact locked dependencies and fresh fixture toolchain
        run: |
          uv sync --locked --extra dev
      - name: Test source and served MCP on newly compiled inputs
        env:
          APSA_HOME: ${{ runner.temp }}/apsa-synthetic-home
          APSA_PARSER_LOCK_DIR: ${{ runner.temp }}/apsa-synthetic-locks
          APSA_TEST_ANDROID_PLATFORM: android-36
          APSA_TEST_ANDROID_BUILD_TOOLS: 36.0.0
        run: |
          APSA_TEST_ANDROID_SDK="$ANDROID_HOME" uv run --locked python -m pytest --basetemp "$RUNNER_TEMP/apsa-synthetic-tests"
      - name: Measure fresh benchmark labels and preserve the known partial control
        run: APSA_TEST_ANDROID_SDK="$ANDROID_HOME" make benchmark BENCHMARK_OUT="$RUNNER_TEMP/apsa-fresh-benchmark"
      - name: Capture actual stdio tool manifests without baseline approval
        run: |
          uv run --locked python scripts/served_mcp_manifest.py --out "$RUNNER_TEMP/apsa-served-mcp" --contract tests/contracts/mcp_tool_manifest_pending.json
      - name: Build twice and clean-install smoke with newly compiled APK
        env:
          APSA_HOME: ${{ runner.temp }}/apsa-package-home
          APSA_TEST_ANDROID_PLATFORM: android-36
          APSA_TEST_ANDROID_BUILD_TOOLS: 36.0.0
        run: |
          APSA_TEST_ANDROID_SDK="$ANDROID_HOME" uv run --locked python scripts/release.py --out "$RUNNER_TEMP/apsa-synthetic-package"
      - name: Preserve only new package validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fresh-synthetic-package-gates-${{ matrix.os }}-${{ matrix.python }}
          path: |
            ${{ runner.temp }}/apsa-synthetic-package
            ${{ runner.temp }}/apsa-served-mcp
            ${{ runner.temp }}/apsa-fresh-benchmark
          if-no-files-found: warn
          retention-days: 14
