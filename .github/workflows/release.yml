name: Publish APSA to PyPI

on:
  push:
    tags: ["v[0-9]*"]
    branches: [main]
    paths: [pyproject.toml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Check the release tag
    if: github.repository == 'ictechgy/apsa' && (github.ref_type == 'tag' || startsWith(github.event.head_commit.message, 'Release APSA '))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Require a tag matching the package version
        id: version
        run: |
          python3 - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          project = tomllib.loads(Path("pyproject.toml").read_text())["project"]
          version = project["version"]
          tag = f"v{version}"
          if project["name"] != "apsa" or not re.fullmatch(r"\d+\.\d+\.\d+", version):
              raise SystemExit("Expected the apsa package with a stable three-part version")
          if os.environ["GITHUB_REF"] not in (f"refs/tags/{tag}", "refs/heads/main"):
              raise SystemExit(f"Run on the {tag} tag or an explicit Release APSA commit on main")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"version={version}\ntag={tag}\n")
          PY

  verify:
    name: Verify all supported CI environments
    needs: validate
    uses: ./.github/workflows/ci.yml

  build:
    name: Build and test the upload artifacts
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.1"
          python-version: "3.12.13"
          enable-cache: false
      - name: Install the locked build environment
        run: |
          uv python install 3.12.13
          uv venv --python 3.12.13
          .venv/bin/python -c 'import pathlib, runpy; pathlib.Path("${{ runner.temp }}/requirements-build.txt").write_text(runpy.run_path("scripts/release.py")["BUILD_REQUIREMENTS"])'
          uv pip install --python .venv/bin/python --require-hashes --only-binary :all: -r "${{ runner.temp }}/requirements-build.txt"
          uv sync --locked --extra dev --no-build-isolation
      - name: Verify repeated builds and clean wheel installation
        run: uv run --locked --extra dev python scripts/release.py --out "${{ runner.temp }}/apsa-release"
      - name: Prepare the PyPI distributions and release bundle
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          mkdir -p "${{ runner.temp }}/pypi-dist" "${{ runner.temp }}/release-assets"
          cp "${{ runner.temp }}/apsa-release/apsa-${RELEASE_VERSION}-py3-none-any.whl" "${{ runner.temp }}/pypi-dist/"
          cp "${{ runner.temp }}/apsa-release/apsa-${RELEASE_VERSION}.tar.gz" "${{ runner.temp }}/pypi-dist/"
          cp "${{ runner.temp }}/pypi-dist/"* "${{ runner.temp }}/release-assets/"
          cp "${{ runner.temp }}/apsa-release/release-manifest.json" "${{ runner.temp }}/release-assets/"
          tar -czf "${{ runner.temp }}/release-assets/apsa-${RELEASE_VERSION}-verified-bundle.tar.gz" -C "${{ runner.temp }}" apsa-release
          cd "${{ runner.temp }}/release-assets"
          sha256sum ./*.whl ./*.tar.gz release-manifest.json > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pypi-dist
          path: ${{ runner.temp }}/pypi-dist/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: ${{ runner.temp }}/release-assets/
          if-no-files-found: error
          retention-days: 7

  tag:
    name: Bind the verified version to an immutable tag
    needs: [validate, verify, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Create the release tag or verify its existing commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          if gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" > tag.json 2> tag-error.txt; then
            python3 - <<'PY'
          import json, os
          ref = json.load(open("tag.json"))["object"]
          if ref["type"] != "commit" or ref["sha"] != os.environ["GITHUB_SHA"]:
              raise SystemExit("Existing release tag does not match the verified commit; refusing to move it")
          PY
          else
            grep -q 'HTTP 404' tag-error.txt || { cat tag-error.txt; exit 1; }
            gh api --method POST "repos/$GH_REPO/git/refs" -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$GITHUB_SHA"
          fi

  publish:
    name: Publish with the registered PyPI publisher
    needs: [validate, verify, build, tag]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/apsa/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pypi-dist
          path: dist/
      - name: Upload the verified wheel and source distribution
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          attestations: true

  mcp-registry:
    name: List the published version in the MCP Registry
    needs: [validate, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # No PyPI environment here: this OIDC token cannot satisfy the PyPI trusted publisher.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Require server.json and the README marker to match the release
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path

          server = json.loads(Path("server.json").read_text())
          version = os.environ["VERSION"]
          if server["name"] != "io.github.ictechgy/apsa" or server["version"] != version:
              raise SystemExit("server.json name or version does not match the release")
          if [p["version"] for p in server["packages"]] != [version]:
              raise SystemExit("server.json package version does not match the release")
          if "mcp-name: io.github.ictechgy/apsa" not in Path("README.md").read_text():
              raise SystemExit("README.md lacks the MCP Registry ownership marker")
          PY
      - name: Install the pinned MCP Registry publisher
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 --output mcp-publisher.tar.gz \
            https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  mcp-publisher.tar.gz" | sha256sum --check -
          tar -xzf mcp-publisher.tar.gz mcp-publisher
      - name: Publish server.json after PyPI serves the release
        run: |
          ./mcp-publisher login github-oidc
          for attempt in 1 2 3 4 5; do
            ./mcp-publisher publish && exit 0
            sleep 60
          done
          exit 1

  github-release:
    name: Attach the verified release downloads
    needs: [validate, build, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: release-assets/
      - name: Create or complete the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* --verify-tag --title "APSA $RELEASE_TAG" --generate-notes
          fi
