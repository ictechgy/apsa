name: Synthetic APSA and MobSF comparison

on:
  push:
    branches: ["benchmark/mobsf-v1"]
    paths:
      - "benchmarks/competitive*.py"
      - "tests/test_competitive.py"
      - ".github/workflows/competitive-benchmark.yml"
      - "src/mobile_audit/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.1"
          python-version: "3.12.13"
          enable-cache: false
      - name: Install locked APSA and validate benchmark driver
        run: |
          uv sync --locked --extra dev
          uv run --locked python -m pytest tests/test_competitive.py
          uv run --locked python -m ruff check benchmarks/competitive.py benchmarks/competitive_cases.py tests/test_competitive.py
      - name: Generate and compile fresh synthetic inputs
        run: |
          uv run --locked python benchmarks/competitive.py generate --fixtures "$RUNNER_TEMP/competitive-fixtures"
          uv run --locked python benchmarks/competitive.py build-apks --fixtures "$RUNNER_TEMP/competitive-fixtures" --sdk "$ANDROID_HOME"
      - name: Prepare MobSF's expected public JADX release
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 https://github.com/skylot/jadx/releases/download/v1.5.0/jadx-1.5.0.zip --output "$RUNNER_TEMP/jadx-1.5.0.zip"
          test "$(stat --format %s "$RUNNER_TEMP/jadx-1.5.0.zip")" = 104967983
          sha256sum "$RUNNER_TEMP/jadx-1.5.0.zip" > "$RUNNER_TEMP/jadx-provenance.txt"
          echo "MOBSF_BENCHMARK_JADX_SHA256=$(sha256sum "$RUNNER_TEMP/jadx-1.5.0.zip" | cut -d ' ' -f 1)" >> "$GITHUB_ENV"
          unzip -q "$RUNNER_TEMP/jadx-1.5.0.zip" -d "$RUNNER_TEMP/jadx-1.5.0"
          chmod +x "$RUNNER_TEMP/jadx-1.5.0/bin/jadx"
          "$RUNNER_TEMP/jadx-1.5.0/bin/jadx" --version
      - name: Start isolated fixed-release MobSF
        run: |
          docker pull opensecurity/mobile-security-framework-mobsf@sha256:5113fbad0727445dda01afdccafea5e107bfa8632ead8a169492f5caa8aa1b7c
          docker image inspect opensecurity/mobile-security-framework-mobsf@sha256:5113fbad0727445dda01afdccafea5e107bfa8632ead8a169492f5caa8aa1b7c --format '{{json .RepoDigests}}' > "$RUNNER_TEMP/mobsf-image-digests.json"
          echo "MOBSF_BENCHMARK_DIGEST=$(docker image inspect opensecurity/mobile-security-framework-mobsf@sha256:5113fbad0727445dda01afdccafea5e107bfa8632ead8a169492f5caa8aa1b7c --format '{{index .RepoDigests 0}}')" >> "$GITHUB_ENV"
          docker network create --internal apsa-synthetic-benchmark
          docker run -d --name apsa-synthetic-mobsf --network apsa-synthetic-benchmark --memory 4g --cpus 2 --security-opt no-new-privileges --cap-drop ALL --mount "type=bind,source=$RUNNER_TEMP/jadx-1.5.0,target=/benchmark-jadx,readonly" -e MOBSF_JADX_BINARY=/benchmark-jadx/bin/jadx -e MOBSF_API_KEY=synthetic-benchmark-only -e MOBSF_DISABLE_AUTHENTICATION=1 opensecurity/mobile-security-framework-mobsf@sha256:5113fbad0727445dda01afdccafea5e107bfa8632ead8a169492f5caa8aa1b7c
          docker exec apsa-synthetic-mobsf /benchmark-jadx/bin/jadx --version
          docker exec apsa-synthetic-mobsf python -c 'import hashlib,pathlib; root=pathlib.Path("/home/mobsf/Mobile-Security-Framework-MobSF"); expected={"mobsf/StaticAnalyzer/views/android/rules/android_rules.yaml":"b5a2411ab48cec34a9743212aab300634f748cf4","mobsf/StaticAnalyzer/views/ios/rules/swift_rules.yaml":"f19571a3ac950bad02ecc4b8c44a9e91acfe889e"}; observed={name:hashlib.sha1(b"blob "+str(len(data)).encode()+b"\0"+data).hexdigest() for name in expected for data in [(root/name).read_bytes()]}; assert observed==expected, observed; print(observed)'
          echo "MOBSF_BENCHMARK_IP=$(docker inspect apsa-synthetic-mobsf --format '{{(index .NetworkSettings.Networks "apsa-synthetic-benchmark").IPAddress}}')" >> "$GITHUB_ENV"
      - name: Install immutable released APSA baseline
        run: |
          mkdir "$RUNNER_TEMP/apsa-baseline-source"
          git archive 6d2216e8ade07208c0b0495507b81574dbb64c61 | tar -x -C "$RUNNER_TEMP/apsa-baseline-source"
          uv sync --project "$RUNNER_TEMP/apsa-baseline-source" --locked --extra dev
      - name: Measure released baseline on the same inputs
        run: |
          uv run --locked python benchmarks/competitive.py run --fixtures "$RUNNER_TEMP/competitive-fixtures" --out "$RUNNER_TEMP/competitive-baseline" --apsa-python "$RUNNER_TEMP/apsa-baseline-source/.venv/bin/python" --repeats 3
      - name: Compare actual scans with frozen labels
        env:
          MOBSF_BENCHMARK_KEY: synthetic-benchmark-only
        run: |
          uv run --locked python benchmarks/competitive.py run --fixtures "$RUNNER_TEMP/competitive-fixtures" --out "$RUNNER_TEMP/competitive-results" --mobsf-url "http://$MOBSF_BENCHMARK_IP:8000" --mobsf-docker-ip "$MOBSF_BENCHMARK_IP" --repeats 3
      - name: Record benchmark-only service diagnostics
        if: failure()
        run: |
          docker inspect apsa-synthetic-mobsf --format '{{json .State}}' > "$RUNNER_TEMP/mobsf-synthetic-state.json" || true
          docker logs --tail 80 apsa-synthetic-mobsf 2>&1 | sed 's/synthetic-benchmark-only/[SYNTHETIC KEY]/g' > "$RUNNER_TEMP/mobsf-synthetic-startup.txt" || true
          cat "$RUNNER_TEMP/mobsf-synthetic-state.json" "$RUNNER_TEMP/mobsf-synthetic-startup.txt"
      - name: Preserve synthetic reports and input/compiler provenance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: synthetic-competitive-benchmark
          path: |
            ${{ runner.temp }}/competitive-fixtures
            ${{ runner.temp }}/competitive-results
            ${{ runner.temp }}/competitive-baseline
            ${{ runner.temp }}/mobsf-image-digests.json
            ${{ runner.temp }}/jadx-provenance.txt
            ${{ runner.temp }}/mobsf-synthetic-state.json
            ${{ runner.temp }}/mobsf-synthetic-startup.txt
          retention-days: 30
          if-no-files-found: error
      - name: Remove benchmark-only service
        if: always()
        run: |
          docker rm -f apsa-synthetic-mobsf || true
          docker network rm apsa-synthetic-benchmark || true
      # No publishing, tokens with write scopes, external app uploads, or device tests.
