name: Synthetic APSA and MobSF comparison

on:
  push:
    branches: ["benchmark/mobsf-v1", "validation/apsa-final-*"]
    paths:
      - "benchmarks/competitive*.py"
      - "benchmarks/semgrep_compare.py"
      - "benchmarks/process_measure.py"
      - "tests/test_competitive.py"
      - "tests/test_competitive_*.py"
      - "tests/test_semgrep_compare.py"
      - "tests/test_process_measure.py"
      - ".github/workflows/competitive-benchmark.yml"
      - "src/mobile_audit/**"
      - "apsa/**"
      - "quaygate/**"
      - "pyproject.toml"
      - "uv.lock"
      - "scripts/verify_dependency.py"
      - "docs/benchmark-integrity.json"
      - "docs/DEPENDENCY_INTEGRITY.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SEMGREP_BENCHMARK_IMAGE: semgrep/semgrep@sha256:93963d9295a366f59e4850127b1550400ee7b388f04fe144e4a1f6325d96e01b
      JADX_BENCHMARK_SHA256: c5a713fa4800cbb9e6df85ced1bef95ba329040c95cb87d54465f108483e4ef9
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.1"
          python-version: "3.12.13"
          enable-cache: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      - name: Install locked APSA and validate benchmark driver
        run: |
          uv sync --locked --extra dev
          uv run --locked python -m pytest tests/test_competitive.py tests/test_semgrep_compare.py
          uv run --locked python -m ruff check benchmarks/competitive.py benchmarks/competitive_cases.py benchmarks/semgrep_compare.py tests/test_competitive.py tests/test_semgrep_compare.py
      - name: Generate and compile fresh synthetic inputs
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
          uv run --locked python benchmarks/competitive.py generate --fixtures "$RUNNER_TEMP/competitive-fixtures"
          uv run --locked python benchmarks/competitive.py build-apks --fixtures "$RUNNER_TEMP/competitive-fixtures" --sdk "$ANDROID_HOME"
      - name: Prepare pinned Semgrep CE and upstream local rules
        run: |
          python - <<'PY'
          import os, re
          if not re.fullmatch(r"semgrep/semgrep@sha256:[0-9a-f]{64}", os.environ["SEMGREP_BENCHMARK_IMAGE"]):
              raise ValueError("Semgrep requires a reviewed source-predeclared OCI digest")
          PY
          docker pull --platform linux/amd64 "$SEMGREP_BENCHMARK_IMAGE"
          docker image inspect "$SEMGREP_BENCHMARK_IMAGE" --format '{{json .RepoDigests}}' > "$RUNNER_TEMP/semgrep-image-digests.json"
          docker image inspect "$SEMGREP_BENCHMARK_IMAGE" --format '{{json .Id}}' > "$RUNNER_TEMP/semgrep-image-id.json"
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          observed = json.loads((Path(os.environ["RUNNER_TEMP"]) / "semgrep-image-digests.json").read_text())
          expected = os.environ["SEMGREP_BENCHMARK_IMAGE"]
          def canonical(reference):
              if not isinstance(reference, str) or not re.fullmatch(r"(?:docker\.io/)?semgrep/semgrep@sha256:[0-9a-f]{64}", reference):
                  return None
              return reference.removeprefix("docker.io/")
          if not isinstance(observed, list) or not 1 <= len(observed) <= 16 or any(canonical(item) is None for item in observed) or canonical(expected) is None or canonical(expected) not in [canonical(item) for item in observed]:
              raise ValueError("Semgrep image identity does not match the declared pin")
          image_id = json.loads((Path(os.environ["RUNNER_TEMP"]) / "semgrep-image-id.json").read_text())
          if not isinstance(image_id, str) or not re.fullmatch(r"sha256:[0-9a-f]{64}", image_id):
              raise ValueError("Semgrep image ID is malformed")
          print("APSA_SEMGREP_IMAGE=" + json.dumps({"declared": expected, "canonical_declared": canonical(expected), "repo_digests": observed, "image_id": image_id, "platform": "linux/amd64"}, sort_keys=True))
          PY
          mkdir "$RUNNER_TEMP/semgrep-container-provenance"
          cat > "$RUNNER_TEMP/semgrep-wrapper" <<'SH'
          #!/bin/sh
          set -eu
          name="apsa-semgrep-$(python -c 'import uuid; print(uuid.uuid4().hex)')"
          container_id="$(docker create --name "$name" --platform linux/amd64 --network none --read-only \
            --security-opt no-new-privileges --cap-drop ALL --memory 2g --cpus 2 \
            --tmpfs /tmp:rw,nosuid,size=536870912 \
            --mount "type=bind,source=$RUNNER_TEMP/competitive-fixtures,target=$RUNNER_TEMP/competitive-fixtures,readonly" \
            --mount "type=bind,source=$RUNNER_TEMP/semgrep-rules,target=$RUNNER_TEMP/semgrep-rules,readonly" \
            --mount "type=bind,source=$RUNNER_TEMP/semgrep-results,target=$RUNNER_TEMP/semgrep-results,readonly" \
            --label "apsa.run-id=$GITHUB_RUN_ID" --label "apsa.head-sha=$GITHUB_SHA" \
            --workdir /tmp --env SEMGREP_CACHE_DIR=/tmp/semgrep-cache \
            --env SEMGREP_SETTINGS_FILE=/tmp/semgrep-settings.yml --env SEMGREP_ENABLE_VERSION_CHECK=0 \
            --env SEMGREP_SEND_METRICS=off --entrypoint semgrep \
            "$SEMGREP_BENCHMARK_IMAGE" "$@")"
          case "$container_id" in *[!0-9a-f]*|'') exit 2 ;; esac
          test "${#container_id}" = 64
          printf '%s\n' "$container_id" >> "$RUNNER_TEMP/semgrep-owned-container-ids.txt"
          docker inspect "$container_id" --format '{"container_id":{{json .Id}},"image_id":{{json .Image}},"declared":{{json .Config.Image}},"run_id":{{json (index .Config.Labels "apsa.run-id")}},"head_sha":{{json (index .Config.Labels "apsa.head-sha")}},"running":{{json .State.Running}},"exit_code":{{json .State.ExitCode}}}' > "$RUNNER_TEMP/semgrep-container-provenance/$container_id.json"
          docker start --attach "$container_id" || true
          running="$(docker inspect "$container_id" --format '{{.State.Running}}')"
          test "$running" = false
          status="$(docker inspect "$container_id" --format '{{.State.ExitCode}}')"
          docker inspect "$container_id" --format '{"container_id":{{json .Id}},"image_id":{{json .Image}},"declared":{{json .Config.Image}},"run_id":{{json (index .Config.Labels "apsa.run-id")}},"head_sha":{{json (index .Config.Labels "apsa.head-sha")}},"running":{{json .State.Running}},"exit_code":{{json .State.ExitCode}}}' > "$RUNNER_TEMP/semgrep-container-provenance/$container_id.json"
          docker rm "$container_id" > /dev/null
          exit "$status"
          SH
          chmod +x "$RUNNER_TEMP/semgrep-wrapper"
          mkdir "$RUNNER_TEMP/semgrep-blobs"
          for blob in 2315e864a09297798df07409356c455203a2a719 15d8f45591363532c307c8e87d4b9b14f8129e58; do
            curl --fail --location --proto '=https' --tlsv1.2 "https://api.github.com/repos/semgrep/semgrep-rules/git/blobs/$blob" --output "$RUNNER_TEMP/semgrep-blobs/$blob.json"
          done
          uv run --locked python benchmarks/semgrep_compare.py prepare-rules --blobs "$RUNNER_TEMP/semgrep-blobs" --out "$RUNNER_TEMP/semgrep-rules"
      - name: Measure limited Semgrep component slice on the same fresh sources
        run: |
          uv run --locked python benchmarks/semgrep_compare.py run --fixtures "$RUNNER_TEMP/competitive-fixtures" --rules "$RUNNER_TEMP/semgrep-rules" --semgrep "$RUNNER_TEMP/semgrep-wrapper" --semgrep-runtime container --semgrep-image "$SEMGREP_BENCHMARK_IMAGE" --out "$RUNNER_TEMP/semgrep-results"
          uv run --locked python - <<'PY'
          import hashlib, json, os, re
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          expected_image_id = json.loads((root / "semgrep-image-id.json").read_text())
          owned = (root / "semgrep-owned-container-ids.txt").read_text().splitlines()
          if not 1 <= len(owned) <= 16 or len(set(owned)) != len(owned):
              raise ValueError("Semgrep container journal is empty or ambiguous")
          container_records = []
          for container_id in owned:
              if not re.fullmatch(r"[0-9a-f]{64}", container_id):
                  raise ValueError("Semgrep journal ID is malformed")
              record = json.loads((root / "semgrep-container-provenance" / (container_id + ".json")).read_text())
              expected = {"container_id": container_id, "image_id": expected_image_id, "declared": os.environ["SEMGREP_BENCHMARK_IMAGE"], "run_id": os.environ["GITHUB_RUN_ID"], "head_sha": os.environ["GITHUB_SHA"], "running": False}
              if not isinstance(record, dict) or any(record.get(key) != value for key, value in expected.items()) or type(record.get("running")) is not bool or type(record.get("exit_code")) is not int or record["exit_code"] != 0:
                  raise ValueError("Semgrep actual container identity or successful completion was not verified")
              container_records.append(record)
          print("APSA_SEMGREP_CONTAINER_EXECUTION=" + json.dumps({"source_revision": os.environ["GITHUB_SHA"], "containers": container_records, "container_execution_verified": True}, sort_keys=True))
          raw = (root / "semgrep-results/result.json").read_bytes()
          result = json.loads(raw)
          observations = [
              {"case": case["id"], **{key: value for key, value in case["tools"]["semgrep"].items() if key in {"state", "seconds", "rss", "rss_state", "rss_bytes"}}}
              for case in result["cases"] if case["tools"]["semgrep"]["state"] != "unsupported"
          ]
          print("APSA_SEMGREP_MEASUREMENT_BEGIN")
          print(json.dumps({"source_revision": os.environ["GITHUB_SHA"], "result_sha256": hashlib.sha256(raw).hexdigest(), "scope": result["scope"], "observations": observations}))
          print("APSA_SEMGREP_MEASUREMENT_END")
          PY
      - name: Prepare MobSF's expected public JADX release
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 https://github.com/skylot/jadx/releases/download/v1.5.0/jadx-1.5.0.zip --output "$RUNNER_TEMP/jadx-1.5.0.zip"
          test "$(stat --format %s "$RUNNER_TEMP/jadx-1.5.0.zip")" = 104967983
          python scripts/verify_dependency.py "$RUNNER_TEMP/jadx-1.5.0.zip" --expected-sha256 "$JADX_BENCHMARK_SHA256" --max-bytes 134217728 > "$RUNNER_TEMP/jadx-provenance.txt"
          cat "$RUNNER_TEMP/jadx-provenance.txt"
          python - <<'PY'
          import json, os, shutil, subprocess, sys
          from pathlib import Path
          original = Path(os.environ["RUNNER_TEMP"]) / "jadx-1.5.0.zip"
          mutated = original.with_name("jadx-mutated.zip")
          shutil.copyfile(original, mutated)
          with mutated.open("r+b") as artifact:
              artifact.seek(original.stat().st_size // 2)
              value = artifact.read(1)
              artifact.seek(-1, 1)
              artifact.write(bytes([value[0] ^ 1]))
          result = subprocess.run([sys.executable, "scripts/verify_dependency.py", str(mutated), "--expected-sha256", os.environ["JADX_BENCHMARK_SHA256"], "--max-bytes", "134217728"], capture_output=True, text=True, check=False, timeout=30)
          observation = json.loads(result.stdout)
          if result.returncode != 1 or observation["reason"] != "sha256_mismatch":
              raise ValueError("mutated JADX was not rejected before extraction")
          print("APSA_JADX_MUTATION=" + json.dumps({"returncode": result.returncode, **observation}, sort_keys=True))
          mutated.unlink()
          PY
          echo "MOBSF_BENCHMARK_JADX_SHA256=$JADX_BENCHMARK_SHA256" >> "$GITHUB_ENV"
          unzip -q "$RUNNER_TEMP/jadx-1.5.0.zip" -d "$RUNNER_TEMP/jadx-1.5.0"
          chmod +x "$RUNNER_TEMP/jadx-1.5.0/bin/jadx"
          "$RUNNER_TEMP/jadx-1.5.0/bin/jadx" --version
      - name: Start isolated fixed-release MobSF
        run: |
          docker pull opensecurity/mobile-security-framework-mobsf@sha256:5113fbad0727445dda01afdccafea5e107bfa8632ead8a169492f5caa8aa1b7c
          docker image inspect opensecurity/mobile-security-framework-mobsf@sha256:5113fbad0727445dda01afdccafea5e107bfa8632ead8a169492f5caa8aa1b7c --format '{{json .RepoDigests}}' > "$RUNNER_TEMP/mobsf-image-digests.json"
          echo "MOBSF_BENCHMARK_DIGEST=$(docker image inspect opensecurity/mobile-security-framework-mobsf@sha256:5113fbad0727445dda01afdccafea5e107bfa8632ead8a169492f5caa8aa1b7c --format '{{index .RepoDigests 0}}')" >> "$GITHUB_ENV"
          docker network create --internal apsa-synthetic-benchmark
          docker run -d --name apsa-synthetic-mobsf --network apsa-synthetic-benchmark --memory 4g --cpus 2 --security-opt no-new-privileges --cap-drop ALL --mount "type=bind,source=$RUNNER_TEMP/jadx-1.5.0,target=/benchmark-jadx,readonly" -e MOBSF_JADX_BINARY=/benchmark-jadx/bin/jadx -e MOBSF_API_KEY=synthetic-benchmark-only -e MOBSF_DISABLE_AUTHENTICATION=1 opensecurity/mobile-security-framework-mobsf@sha256:5113fbad0727445dda01afdccafea5e107bfa8632ead8a169492f5caa8aa1b7c
          docker exec apsa-synthetic-mobsf /benchmark-jadx/bin/jadx --version
          docker exec apsa-synthetic-mobsf python -c 'import hashlib,pathlib; root=pathlib.Path("/home/mobsf/Mobile-Security-Framework-MobSF"); expected={"mobsf/StaticAnalyzer/views/android/rules/android_rules.yaml":"b5a2411ab48cec34a9743212aab300634f748cf4","mobsf/StaticAnalyzer/views/ios/rules/swift_rules.yaml":"f19571a3ac950bad02ecc4b8c44a9e91acfe889e"}; observed={name:hashlib.sha1(b"blob "+str(len(data)).encode()+b"\0"+data).hexdigest() for name in expected for data in [(root/name).read_bytes()]}; assert observed==expected, observed; print(observed)'
          echo "MOBSF_BENCHMARK_IP=$(docker inspect apsa-synthetic-mobsf --format '{{(index .NetworkSettings.Networks "apsa-synthetic-benchmark").IPAddress}}')" >> "$GITHUB_ENV"
          echo "MOBSF_BENCHMARK_PID=$(docker inspect apsa-synthetic-mobsf --format '{{.State.Pid}}')" >> "$GITHUB_ENV"
      - name: Compare actual scans with frozen labels
        env:
          MOBSF_BENCHMARK_KEY: synthetic-benchmark-only
        run: |
          uv run --locked python benchmarks/competitive.py run --fixtures "$RUNNER_TEMP/competitive-fixtures" --out "$RUNNER_TEMP/competitive-results" --mobsf-url "http://$MOBSF_BENCHMARK_IP:8000" --mobsf-docker-ip "$MOBSF_BENCHMARK_IP" --repeats 3
      - name: Record benchmark-only service diagnostics
        if: failure()
        run: |
          docker inspect apsa-synthetic-mobsf --format '{{json .State}}' > "$RUNNER_TEMP/mobsf-synthetic-state.json" || true
          docker logs --tail 80 apsa-synthetic-mobsf 2>&1 | sed 's/synthetic-benchmark-only/[SYNTHETIC KEY]/g' > "$RUNNER_TEMP/mobsf-synthetic-startup.txt" || true
          cat "$RUNNER_TEMP/mobsf-synthetic-state.json" "$RUNNER_TEMP/mobsf-synthetic-startup.txt"
      - name: Preserve synthetic reports and input/compiler provenance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: synthetic-competitive-benchmark
          path: |
            ${{ runner.temp }}/competitive-fixtures
            ${{ runner.temp }}/competitive-results
            ${{ runner.temp }}/mobsf-image-digests.json
            ${{ runner.temp }}/jadx-provenance.txt
            ${{ runner.temp }}/mobsf-synthetic-state.json
            ${{ runner.temp }}/mobsf-synthetic-startup.txt
            ${{ runner.temp }}/semgrep-image-digests.json
            ${{ runner.temp }}/semgrep-image-id.json
            ${{ runner.temp }}/semgrep-container-provenance
            ${{ runner.temp }}/semgrep-owned-container-ids.txt
            ${{ runner.temp }}/semgrep-rules
            ${{ runner.temp }}/semgrep-results
          retention-days: 30
          if-no-files-found: error
      - name: Remove benchmark-only service
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/semgrep-owned-container-ids.txt" ]; then
            while IFS= read -r container_id; do
              [[ "$container_id" =~ ^[0-9a-f]{64}$ ]] || exit 1
              if owner=$(docker inspect "$container_id" --format '{{index .Config.Labels "apsa.run-id"}}/{{index .Config.Labels "apsa.head-sha"}}' 2>/dev/null); then
                test "$owner" = "$GITHUB_RUN_ID/$GITHUB_SHA"
                docker rm -f "$container_id"
              fi
            done < "$RUNNER_TEMP/semgrep-owned-container-ids.txt"
          fi
          docker rm -f apsa-synthetic-mobsf || true
          docker network rm apsa-synthetic-benchmark || true
      # No publishing, tokens with write scopes, external app uploads, or device tests.
