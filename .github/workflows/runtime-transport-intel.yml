name: NEW synthetic Intel runtime transport differential

on:
  push:
    branches: ["validation/apsa-final-*"]
    paths: ["src/mobile_audit/runtime_acquisition.py", "src/mobile_audit/runtime_evidence.py", "tests/support/runtime_transport.py", "scripts/validate_runtime_transport.py", "tests/test_runtime_transport.py", "tests/test_runtime_builder_config.py", "tests/fixtures/runtime/transport/**", ".github/workflows/runtime-transport-intel.yml"]
  workflow_dispatch:

permissions:
  contents: read

# A bounded host-architecture differential; the existing ARM64 gates remain independent.
jobs:
  ios-os-url-control-intel:
    runs-on: macos-15-intel
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        driver: [simctl, companion]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: "0.12.1"
          python-version: "3.12.13"
          enable-cache: false
      - run: uv sync --locked --extra dev
      - name: Assert the hosted Intel differential architecture
        run: |
          .venv/bin/python - <<'PYARCH'
          import json
          import os
          import platform
          architecture = platform.machine()
          print("APSA_INTEL_HOST=" + json.dumps({"source_revision": os.environ["GITHUB_SHA"], "architecture": architecture}, sort_keys=True), flush=True)
          if architecture != "x86_64":
              raise SystemExit("Intel differential requires x86_64")
          PYARCH
      - name: Explicit toolchain with bundled NEW simulator runtime
        run: |
          test -d /Applications/Xcode_16.4.app
          echo "DEVELOPER_DIR=/Applications/Xcode_16.4.app/Contents/Developer" >> "$GITHUB_ENV"
      - name: Differential warm and cold OS URL delivery on a NEW owned target
        run: uv run --locked python scripts/validate_runtime_transport.py --platform ios --ios-device-set custom --ios-os-url-control --ios-url-driver ${{ matrix.driver }} --ios-runtime com.apple.CoreSimulator.SimRuntime.iOS-18-5 --ios-device-type com.apple.CoreSimulator.SimDeviceType.iPhone-16 --work "$RUNNER_TEMP/runtime-url-control-intel"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: new-ios-intel-os-url-control-${{ matrix.driver }}-digests
          path: |
            ${{ runner.temp }}/runtime-url-control-intel/evidence.json
            ${{ runner.temp }}/runtime-url-control-intel/commands.json
          retention-days: 14
          if-no-files-found: error
      - name: Cleanup only journaled NEW resources after evidence preservation
        if: always()
        timeout-minutes: 5
        run: .venv/bin/python scripts/validate_runtime_transport.py --platform ios --cleanup-only --work "$RUNNER_TEMP/runtime-url-control-intel"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: new-ios-intel-os-url-control-${{ matrix.driver }}-terminal-cleanup-digests
          path: |
            ${{ runner.temp }}/runtime-url-control-intel/evidence.json
            ${{ runner.temp }}/runtime-url-control-intel/cleanup.json
            ${{ runner.temp }}/runtime-url-control-intel/cleanup-commands.json
          retention-days: 14
          if-no-files-found: error
  ios-app-to-app-intel:
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: "0.12.1"
          python-version: "3.12.13"
          enable-cache: false
      - run: uv sync --locked --extra dev
      - name: Assert the hosted Intel differential architecture
        run: |
          .venv/bin/python - <<'PYARCH'
          import json
          import os
          import platform
          architecture = platform.machine()
          print("APSA_INTEL_HOST=" + json.dumps({"source_revision": os.environ["GITHUB_SHA"], "architecture": architecture}, sort_keys=True), flush=True)
          if architecture != "x86_64":
              raise SystemExit("Intel differential requires x86_64")
          PYARCH
      - name: Explicit toolchain with bundled NEW simulator runtime
        run: |
          test -d /Applications/Xcode_16.4.app
          echo "DEVELOPER_DIR=/Applications/Xcode_16.4.app/Contents/Developer" >> "$GITHUB_ENV"
      - name: NEW UIKit companion, target cold/warm callbacks and independent HTTP replay
        run: uv run --locked python scripts/validate_runtime_transport.py --platform ios --ios-device-set custom --ios-url-driver companion --ios-runtime com.apple.CoreSimulator.SimRuntime.iOS-18-5 --ios-device-type com.apple.CoreSimulator.SimDeviceType.iPhone-16 --work "$RUNNER_TEMP/runtime-new-intel-companion"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: new-ios-intel-app-to-app-runtime-digests
          path: |
            ${{ runner.temp }}/runtime-new-intel-companion/evidence.json
            ${{ runner.temp }}/runtime-new-intel-companion/commands.json
          retention-days: 14
          if-no-files-found: error
      - name: Cleanup only journaled NEW resources after evidence preservation
        if: always()
        timeout-minutes: 5
        run: .venv/bin/python scripts/validate_runtime_transport.py --platform ios --cleanup-only --work "$RUNNER_TEMP/runtime-new-intel-companion"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: new-ios-intel-app-to-app-terminal-cleanup-digests
          path: |
            ${{ runner.temp }}/runtime-new-intel-companion/evidence.json
            ${{ runner.temp }}/runtime-new-intel-companion/cleanup.json
            ${{ runner.temp }}/runtime-new-intel-companion/cleanup-commands.json
          retention-days: 14
          if-no-files-found: error
