name: NEW hosted Simulator GUI setup control — 1.6.0 candidate

on:
  push:
    branches: ["validation/apsa-final-*"]
    paths: ["scripts/validate_runtime_gui_control.py", "tests/test_runtime_gui_control.py", ".github/workflows/runtime-gui-control.yml"]
  workflow_dispatch:

permissions:
  contents: read

# Setup hypothesis only. Existing acquisition and OS callback gates stay independent.
jobs:
  ios-gui-setup-control:
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        driver: [simctl, companion]
        selector: [custom, default]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: "0.12.1"
          python-version: "3.12.13"
          enable-cache: false
      - run: uv sync --locked --extra dev
      - name: Explicit pinned toolchain for CREATE-returned NEW simulator UUIDs
        run: |
          test -d /Applications/Xcode_16.4.app
          echo "DEVELOPER_DIR=/Applications/Xcode_16.4.app/Contents/Developer" >> "$GITHUB_ENV"
      - name: Setup-specific GUI start before unchanged OS callbacks and HTTP acquisition
        run: .venv/bin/python -B -m scripts.validate_runtime_gui_control --ios-device-set ${{ matrix.selector }} --ios-url-driver ${{ matrix.driver }} --work "$RUNNER_TEMP/runtime-new-gui-${{ matrix.selector }}-${{ matrix.driver }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: new-ios-gui-setup-control-${{ matrix.selector }}-${{ matrix.driver }}-digests
          path: |
            ${{ runner.temp }}/runtime-new-gui-${{ matrix.selector }}-${{ matrix.driver }}/gui-control.json
            ${{ runner.temp }}/runtime-new-gui-${{ matrix.selector }}-${{ matrix.driver }}/evidence.json
            ${{ runner.temp }}/runtime-new-gui-${{ matrix.selector }}-${{ matrix.driver }}/commands.json
          retention-days: 14
          if-no-files-found: error
      - name: Cleanup only journaled NEW devices after owned GUI child cleanup
        if: always()
        timeout-minutes: 5
        run: .venv/bin/python -B scripts/validate_runtime_transport.py --platform ios --cleanup-only --work "$RUNNER_TEMP/runtime-new-gui-${{ matrix.selector }}-${{ matrix.driver }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: new-ios-gui-setup-control-${{ matrix.selector }}-${{ matrix.driver }}-terminal-cleanup-digests
          path: |
            ${{ runner.temp }}/runtime-new-gui-${{ matrix.selector }}-${{ matrix.driver }}/gui-control.json
            ${{ runner.temp }}/runtime-new-gui-${{ matrix.selector }}-${{ matrix.driver }}/evidence.json
            ${{ runner.temp }}/runtime-new-gui-${{ matrix.selector }}-${{ matrix.driver }}/commands.json
            ${{ runner.temp }}/runtime-new-gui-${{ matrix.selector }}-${{ matrix.driver }}/cleanup.json
            ${{ runner.temp }}/runtime-new-gui-${{ matrix.selector }}-${{ matrix.driver }}/cleanup-commands.json
          retention-days: 14
          if-no-files-found: error
