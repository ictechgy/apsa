name: NEW synthetic installed runtime transport

on:
  push:
    branches: ["validation/apsa-final-*"]
    paths: ["src/mobile_audit/runtime_transport.py", "scripts/validate_runtime_transport.py", "tests/fixtures/runtime/transport/**", ".github/workflows/runtime-transport.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: "0.12.1"
          python-version: "3.12.13"
          enable-cache: false
      - run: uv sync --locked --extra dev
      - name: Separate real HTTP authority measurement
        run: uv run --locked python scripts/validate_runtime_transport.py --platform backend --work "$RUNNER_TEMP/runtime-new"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: new-http-authority-digests
          path: ${{ runner.temp }}/runtime-new/evidence.json
          retention-days: 14
          if-no-files-found: error
      - name: Cleanup only journaled NEW resources after evidence preservation
        if: always()
        timeout-minutes: 5
        run: .venv/bin/python scripts/validate_runtime_transport.py --platform backend --cleanup-only --work "$RUNNER_TEMP/runtime-new"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: new-backend-terminal-cleanup-digests
          path: |
            ${{ runner.temp }}/runtime-new/evidence.json
            ${{ runner.temp }}/runtime-new/cleanup.json
            ${{ runner.temp }}/runtime-new/cleanup-commands.json
          retention-days: 14
          if-no-files-found: error
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: "0.12.1"
          python-version: "3.12.13"
          enable-cache: false
      - run: uv sync --locked --extra dev
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: ""
          log-accepted-android-sdk-licenses: "false"
      - name: Install pinned synthetic device inputs
        run: sdkmanager "build-tools;35.0.0" "platforms;android-35" "emulator" "platform-tools" "system-images;android-35;google_apis;x86_64"
      - name: Enable hosted runner KVM access
        run: |
          sudo chmod 666 /dev/kvm
      - name: NEW AVD, installed APK, OS intents and independent HTTP replay
        run: uv run --locked python scripts/validate_runtime_transport.py --platform android --sdk "$ANDROID_HOME" --jdk "$JAVA_HOME_17_X64" --work "$RUNNER_TEMP/runtime-new"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: new-android-runtime-digests
          path: |
            ${{ runner.temp }}/runtime-new/evidence.json
            ${{ runner.temp }}/runtime-new/commands.json
          retention-days: 14
          if-no-files-found: error
      - name: Cleanup only journaled NEW resources after evidence preservation
        if: always()
        timeout-minutes: 5
        run: .venv/bin/python scripts/validate_runtime_transport.py --platform android --cleanup-only --work "$RUNNER_TEMP/runtime-new"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: new-android-terminal-cleanup-digests
          path: |
            ${{ runner.temp }}/runtime-new/evidence.json
            ${{ runner.temp }}/runtime-new/cleanup.json
            ${{ runner.temp }}/runtime-new/cleanup-commands.json
          retention-days: 14
          if-no-files-found: error
  ios:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: "0.12.1"
          python-version: "3.12.13"
          enable-cache: false
      - run: uv sync --locked --extra dev
      - name: Explicit toolchain with bundled NEW simulator runtime
        run: |
          test -d /Applications/Xcode_16.4.app
          echo "DEVELOPER_DIR=/Applications/Xcode_16.4.app/Contents/Developer" >> "$GITHUB_ENV"
      - name: NEW simulator UUIDs, installed executables, OS URL contexts and HTTP replay
        run: uv run --locked python scripts/validate_runtime_transport.py --platform ios --ios-runtime com.apple.CoreSimulator.SimRuntime.iOS-18-5 --ios-device-type com.apple.CoreSimulator.SimDeviceType.iPhone-16 --work "$RUNNER_TEMP/runtime-new"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: new-ios-runtime-digests
          path: |
            ${{ runner.temp }}/runtime-new/evidence.json
            ${{ runner.temp }}/runtime-new/commands.json
          retention-days: 14
          if-no-files-found: error
      - name: Cleanup only journaled NEW resources after evidence preservation
        if: always()
        timeout-minutes: 5
        run: .venv/bin/python scripts/validate_runtime_transport.py --platform ios --cleanup-only --work "$RUNNER_TEMP/runtime-new"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: new-ios-terminal-cleanup-digests
          path: |
            ${{ runner.temp }}/runtime-new/evidence.json
            ${{ runner.temp }}/runtime-new/cleanup.json
            ${{ runner.temp }}/runtime-new/cleanup-commands.json
          retention-days: 14
          if-no-files-found: error
  ios-app-to-app:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: "0.12.1"
          python-version: "3.12.13"
          enable-cache: false
      - run: uv sync --locked --extra dev
      - name: Explicit toolchain with bundled NEW simulator runtime
        run: |
          test -d /Applications/Xcode_16.4.app
          echo "DEVELOPER_DIR=/Applications/Xcode_16.4.app/Contents/Developer" >> "$GITHUB_ENV"
      - name: NEW UIKit companion, target cold/warm callbacks and independent HTTP replay
        run: uv run --locked python scripts/validate_runtime_transport.py --platform ios --ios-url-driver companion --ios-runtime com.apple.CoreSimulator.SimRuntime.iOS-18-5 --ios-device-type com.apple.CoreSimulator.SimDeviceType.iPhone-16 --work "$RUNNER_TEMP/runtime-new"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: new-ios-app-to-app-runtime-digests
          path: |
            ${{ runner.temp }}/runtime-new/evidence.json
            ${{ runner.temp }}/runtime-new/commands.json
          retention-days: 14
          if-no-files-found: error
      - name: Cleanup only journaled NEW resources after evidence preservation
        if: always()
        timeout-minutes: 5
        run: .venv/bin/python scripts/validate_runtime_transport.py --platform ios --cleanup-only --work "$RUNNER_TEMP/runtime-new"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: new-ios-app-to-app-terminal-cleanup-digests
          path: |
            ${{ runner.temp }}/runtime-new/evidence.json
            ${{ runner.temp }}/runtime-new/cleanup.json
            ${{ runner.temp }}/runtime-new/cleanup-commands.json
          retention-days: 14
          if-no-files-found: error
