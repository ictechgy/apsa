name: Official bundletool fresh split oracle

on:
  push:
    branches: ["validation/apsa-final-*"]
    paths: ["src/mobile_audit/**", "scripts/validate_bundletool.py", "tests/test_bundletool_validation.py", ".github/workflows/bundletool-validation.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  official-fresh-splits:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ANDROID_AVD_HOME: ${{ runner.temp }}/apsa-bundletool-avd
      ANDROID_USER_HOME: ${{ runner.temp }}/apsa-bundletool-android
      ADB_SERVER_SOCKET: tcp:localhost:5038
      ANDROID_ADB_SERVER_PORT: "5038"
      APSA_HOME: ${{ runner.temp }}/apsa-bundletool-home
      APSA_PARSER_LOCK_DIR: ${{ runner.temp }}/apsa-bundletool-locks
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: "0.12.1"
          python-version: "3.12.13"
          enable-cache: false
      - name: Install exact dependencies and SDK packages into disposable CI
        run: |
          uv sync --locked --extra dev
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "system-images;android-36;google_apis;x86_64" "emulator"
      - name: Download pinned official public bundletool and Maven AAPT2
        run: |
          mkdir "$RUNNER_TEMP/apsa-bundletool-tools"
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar \
            --output "$RUNNER_TEMP/apsa-bundletool-tools/bundletool.jar"
          printf '%s  %s\n' a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29 "$RUNNER_TEMP/apsa-bundletool-tools/bundletool.jar" | sha256sum --check
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            https://dl.google.com/dl/android/maven2/com/android/tools/build/aapt2/8.10.1-12782657/aapt2-8.10.1-12782657-linux.jar \
            --output "$RUNNER_TEMP/apsa-bundletool-tools/aapt2.jar"
          unzip -q "$RUNNER_TEMP/apsa-bundletool-tools/aapt2.jar" aapt2 -d "$RUNNER_TEMP/apsa-bundletool-tools"
          chmod +x "$RUNNER_TEMP/apsa-bundletool-tools/aapt2"
      - name: Create and boot only the new dedicated emulator
        run: |
          mkdir -p "$ANDROID_AVD_HOME" "$ANDROID_USER_HOME"
          printf 'no\n' | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --name apsa_bundletool_new --package "system-images;android-36;google_apis;x86_64"
          sudo chmod a+rw /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -avd apsa_bundletool_new -port 5572 -no-window -no-audio -no-boot-anim -no-snapshot -wipe-data -gpu swiftshader_indirect > "$RUNNER_TEMP/apsa-bundletool-emulator-new.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/apsa-bundletool-emulator.pid"
          timeout 300 "$ANDROID_HOME/platform-tools/adb" -P 5038 -s emulator-5572 wait-for-device
          for attempt in $(seq 1 120); do
            if [ "$("$ANDROID_HOME/platform-tools/adb" -P 5038 -s emulator-5572 shell getprop sys.boot_completed | tr -d '\r')" = 1 ]; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Execute real build, extraction, installed split acquisition and resource merge
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          uv run --locked python scripts/validate_bundletool.py \
            --work "$RUNNER_TEMP/apsa-bundletool-new" \
            --aapt2 "$RUNNER_TEMP/apsa-bundletool-tools/aapt2" \
            --android "$ANDROID_HOME/platforms/android-36/android.jar" \
            --d8 "$ANDROID_HOME/build-tools/36.0.0/d8" \
            --java "$JAVA_HOME_17_X64/bin/java" --javac "$JAVA_HOME_17_X64/bin/javac" \
            --keytool "$JAVA_HOME_17_X64/bin/keytool" \
            --bundletool "$RUNNER_TEMP/apsa-bundletool-tools/bundletool.jar" \
            --serial emulator-5572 --adb "$ANDROID_HOME/platform-tools/adb" --adb-port 5038
      - name: Preserve new textual evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: official-bundletool-fresh-oracle
          path: ${{ runner.temp }}/apsa-bundletool-new/evidence
          if-no-files-found: warn
          retention-days: 14
      - name: Destroy only this job's new emulator, fixture binaries and signing key
        if: always()
        run: |
          "$ANDROID_HOME/platform-tools/adb" -P 5038 -s emulator-5572 emu kill || true
          if [ -f "$RUNNER_TEMP/apsa-bundletool-emulator.pid" ]; then kill "$(cat "$RUNNER_TEMP/apsa-bundletool-emulator.pid")" || true; fi
          "$ANDROID_HOME/platform-tools/adb" -P 5038 kill-server || true
          rm -rf "$ANDROID_AVD_HOME" "$ANDROID_USER_HOME" "$RUNNER_TEMP/apsa-bundletool-new" "$RUNNER_TEMP/apsa-bundletool-tools" "$RUNNER_TEMP/apsa-bundletool-home" "$RUNNER_TEMP/apsa-bundletool-locks"
          rm -f "$RUNNER_TEMP/apsa-bundletool-emulator-new.log" "$RUNNER_TEMP/apsa-bundletool-emulator.pid"
