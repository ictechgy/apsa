name: Public benchmark dependency digest acquisition (no execution)

on:
  push:
    branches: ["validation/apsa-final-*"]
    paths:
      - ".github/workflows/benchmark-dependency-acquisition.yml"
      - "scripts/acquire_benchmark_dependencies.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acquire-public-benchmark-dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: "0.12.1"
          python-version: "3.12.13"
          enable-cache: false
      - name: Acquire public bytes and image content address without running tools
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          python -I scripts/acquire_benchmark_dependencies.py --work "$RUNNER_TEMP/benchmark-dependency-acquisition"
      - name: Preserve only public textual acquisition provenance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-benchmark-dependency-acquisition-provenance
          path: ${{ runner.temp }}/benchmark-dependency-acquisition/acquisition.json
          if-no-files-found: warn
          retention-days: 14
      - name: Remove only this new textual evidence directory after upload
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/benchmark-dependency-acquisition"
