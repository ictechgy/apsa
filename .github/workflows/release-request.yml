name: Recover the approved APSA 1.1.0 release
on:
  push:
    branches: [main]
    paths: [.github/release-request.json]
permissions:
  contents: read
jobs:
  dispatch:
    if: github.repository == 'ictechgy/apsa'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Dispatch only the approved immutable 1.1.0 tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          request = json.loads(Path('.github/release-request.json').read_text())
          tag, sha = request['tag'], request['sha']
          if (tag, sha) != ('v1.1.0', 'a2149c23288079e4e4dd57c7eda1bd822c9097d1'):
              raise SystemExit('This recovery is authorized only for the reviewed APSA 1.1.0 commit')
          ref = json.loads(subprocess.check_output(['gh', 'api', f"repos/{os.environ['GH_REPO']}/git/ref/tags/{tag}"]))['object']
          if ref['type'] != 'commit' or ref['sha'] != sha:
              raise SystemExit('Release request does not match the immutable approved tag')
          subprocess.run(['gh', 'workflow', 'run', 'release.yml', '--repo', os.environ['GH_REPO'], '--ref', tag], check=True)
          PY
