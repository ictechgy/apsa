name: NEW hosted modern Simulator GUI setup control

on:
  push:
    branches: ["validation/apsa-final-*"]
    paths: ["scripts/validate_runtime_gui_control.py", "tests/test_runtime_gui_control.py", ".github/workflows/runtime-modern-control.yml"]
  workflow_dispatch:

permissions:
  contents: read

# Setup hypothesis only. The unchanged six-case driver keeps every OS callback gate.
# Modern control uses only NEW custom-set UUIDs; the legacy default-set guard stays pinned.
jobs:
  ios-modern-setup-control:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    strategy:
      fail-fast: false
      matrix:
        driver: [simctl, companion]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: "0.12.1"
          python-version: "3.12.13"
          enable-cache: false
      - run: uv sync --locked --extra dev
      - name: Require the exact pinned modern toolchain
        run: test -d /Applications/Xcode_26.3.app/Contents/Developer
      - name: Modern custom-set GUI setup before unchanged six-case runtime gates
        run: .venv/bin/python -B -m scripts.validate_runtime_gui_control --ios-toolchain modern --ios-device-set custom --ios-url-driver ${{ matrix.driver }} --work "$RUNNER_TEMP/runtime-new-modern-${{ matrix.driver }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: new-ios-modern-setup-control-${{ matrix.driver }}-digests
          path: |
            ${{ runner.temp }}/runtime-new-modern-${{ matrix.driver }}/gui-control.json
            ${{ runner.temp }}/runtime-new-modern-${{ matrix.driver }}/evidence.json
            ${{ runner.temp }}/runtime-new-modern-${{ matrix.driver }}/commands.json
          retention-days: 14
          if-no-files-found: error
      - name: Cleanup only journaled NEW devices after owned GUI child cleanup
        if: always()
        timeout-minutes: 5
        run: .venv/bin/python -B scripts/validate_runtime_transport.py --platform ios --cleanup-only --work "$RUNNER_TEMP/runtime-new-modern-${{ matrix.driver }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: new-ios-modern-setup-control-${{ matrix.driver }}-terminal-cleanup-digests
          path: |
            ${{ runner.temp }}/runtime-new-modern-${{ matrix.driver }}/gui-control.json
            ${{ runner.temp }}/runtime-new-modern-${{ matrix.driver }}/evidence.json
            ${{ runner.temp }}/runtime-new-modern-${{ matrix.driver }}/commands.json
            ${{ runner.temp }}/runtime-new-modern-${{ matrix.driver }}/cleanup.json
            ${{ runner.temp }}/runtime-new-modern-${{ matrix.driver }}/cleanup-commands.json
          retention-days: 14
          if-no-files-found: error
