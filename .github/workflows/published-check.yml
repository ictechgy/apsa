name: Verify published APSA artifacts and cold startup

on:
  workflow_call:
    inputs:
      source-sha:
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify-publication:
    if: github.repository == 'ictechgy/apsa' && github.ref_type == 'tag'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ inputs.source-sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: "0.12.1"
          python-version: "3.12.13"
          enable-cache: false
      - name: Select the exact publication verifier interpreter
        run: |
          uv python install 3.12.13
          echo "APSA_VERIFIER_PYTHON=$(uv python find 3.12.13)" >> "$GITHUB_ENV"
      - name: Bind checkout, version, public registries and downloaded package bytes
        env:
          RELEASE_SHA: ${{ inputs.source-sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          version="$("$APSA_VERIFIER_PYTHON" -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          "$APSA_VERIFIER_PYTHON" scripts/verify_publication.py --version "$version" --source-sha "$RELEASE_SHA" --out "$RUNNER_TEMP/publication"
      - name: Install verified PyPI wheel into a new isolated environment
        env:
          UV_CACHE_DIR: ${{ runner.temp }}/public-install-cache
        run: |
          uv venv --python 3.12.13 "$RUNNER_TEMP/public-install"
          uv pip install --python "$RUNNER_TEMP/public-install/bin/python" --require-hashes --only-binary :all: -r requirements-release.txt
          uv pip install --python "$RUNNER_TEMP/public-install/bin/python" --no-deps "$RUNNER_TEMP/publication/apsa-${RELEASE_VERSION}-py3-none-any.whl"
          for alias in apsa quaygate mobile-audit; do
            test "$("$RUNNER_TEMP/public-install/bin/$alias" --version)" = "$RELEASE_VERSION"
          done
          for module in apsa quaygate mobile_audit; do
            test "$("$RUNNER_TEMP/public-install/bin/python" -I -m "$module" --version)" = "$RELEASE_VERSION"
          done
      - name: Public uvx cold resolution with bounded fresh-cache retries
        run: |
          "$APSA_VERIFIER_PYTHON" scripts/verify_cold_start.py --version "$RELEASE_VERSION" --out "$RUNNER_TEMP/public-cold-start"
      - name: Actual installed stdio SDK initialize and tools/list in both scopes
        run: |
          "$RUNNER_TEMP/public-install/bin/python" -I scripts/served_mcp_manifest.py --out "$RUNNER_TEMP/public-mcp" --contract tests/contracts/mcp_tool_manifest_pending.json
      - name: Offline source scan and report integrity on NEW synthetic inputs
        env:
          APSA_HOME: ${{ runner.temp }}/public-scan-home
        run: |
          mkdir "$RUNNER_TEMP/public-source"
          printf '%s\n' 'class NewPublicFixture { void run() {} }' > "$RUNNER_TEMP/public-source/Main.java"
          printf '%s\n' '<manifest xmlns:android="http://schemas.android.com/apk/res/android" package="apsa.new.publicfixture"><uses-sdk android:minSdkVersion="24" android:targetSdkVersion="36"/><application android:debuggable="false" android:allowBackup="false"/></manifest>' > "$RUNNER_TEMP/public-source/AndroidManifest.xml"
          "$RUNNER_TEMP/public-install/bin/apsa" scan "$RUNNER_TEMP/public-source" --home "$APSA_HOME" --json > "$RUNNER_TEMP/public-scan.json"
          "$RUNNER_TEMP/public-install/bin/python" - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          report = json.loads((root / "public-scan.json").read_text())["data"]
          assert report["id"]
          result = subprocess.run([str(root / "public-install/bin/apsa"), "reports", "verify", "--home", os.environ["APSA_HOME"], "--json"], check=True, capture_output=True, text=True)
          (root / "public-report-verify.json").write_text(result.stdout)
          print("APSA_PUBLIC_STARTUP=" + json.dumps({"version": os.environ["RELEASE_VERSION"], "scan_and_report_verify": True, "served_mcp_scopes": ["default", "runtime"], "published_baseline_approved": False}, sort_keys=True), flush=True)
          PY
      - name: Actual installed MCP capabilities and synthetic audit call
        run: |
          "$RUNNER_TEMP/public-install/bin/python" -I - <<'PY'
          import asyncio, json, os, sys
          from pathlib import Path
          from mcp import ClientSession, StdioServerParameters
          from mcp.client.stdio import stdio_client
          async def check():
              root = Path(os.environ["RUNNER_TEMP"])
              params = StdioServerParameters(command=sys.executable, args=["-I", "-m", "apsa", "--home", str(root / "public-tool-home"), "mcp", "--root", str(root / "public-source")])
              async with stdio_client(params) as streams:
                  async with ClientSession(*streams) as session:
                      await session.initialize()
                      capabilities = await session.call_tool("capabilities", {})
                      assert not capabilities.isError and "apks" in capabilities.structuredContent["inputs"]
                      audit = await session.call_tool("audit_scan", {"target": str(root / "public-source")})
                      assert not audit.isError and audit.structuredContent["report_id"]
                      result = {"capabilities_apks": True, "synthetic_audit_scan": True}
                      (root / "public-mcp-tools.json").write_text(json.dumps(result) + "\n")
                      print("APSA_PUBLIC_TOOLS=" + json.dumps(result), flush=True)
          asyncio.run(asyncio.wait_for(check(), timeout=90))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: public-publication-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/publication/*.json
            ${{ runner.temp }}/publication/SHA256SUMS
            ${{ runner.temp }}/public-mcp/*.json
            ${{ runner.temp }}/public-scan.json
            ${{ runner.temp }}/public-report-verify.json
            ${{ runner.temp }}/public-mcp-tools.json
            ${{ runner.temp }}/public-cold-start/result.json
            ${{ runner.temp }}/public-cold-start/attempt-*/result.json
            ${{ runner.temp }}/public-cold-start/attempt-*/stdout
            ${{ runner.temp }}/public-cold-start/attempt-*/stderr
          retention-days: 30
          if-no-files-found: error
